<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Super Sparrow</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #08090b;
        color: #e7e8ec;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      main {
        width: min(440px, calc(100vw - 48px));
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
      }
      p {
        margin: 0 0 20px;
        color: #a2aec2;
        line-height: 1.5;
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-size: 13px;
        color: #c9d1dd;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #343a46;
        border-radius: 8px;
        background: #121419;
        color: inherit;
        font-size: 15px;
      }
      input:focus {
        outline: 2px solid #4f73f0;
        outline-offset: 1px;
      }
      button {
        margin-top: 16px;
        padding: 10px 18px;
        border: 1px solid #3264ff;
        border-radius: 999px;
        background: #2455eb;
        color: white;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
      }
      [role="alert"] {
        margin: 12px 0 0;
        color: #f2a9ae;
      }
      kbd {
        padding: 1px 6px;
        border: 1px solid #343a46;
        border-radius: 4px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Connect to Super Sparrow</h1>
      <p>
        Enter your team's Super Sparrow address. The app then stays in the tray and starts at login,
        so <kbd>Ctrl</kbd> <kbd>Q</kbd> opens quick capture over any application.
      </p>
      <form id="setup">
        <label for="address">Server address</label>
        <input
          id="address"
          name="address"
          type="text"
          inputmode="url"
          autocomplete="url"
          placeholder="https://sparrow.example.com"
          required
          autofocus
        />
        <p id="error" role="alert" hidden></p>
        <button type="submit">Connect</button>
      </form>
    </main>
    <script>
      const invoke = window.__TAURI__.core.invoke;
      const form = document.getElementById("setup");
      const address = document.getElementById("address");
      const error = document.getElementById("error");

      invoke("current_server").then((current) => {
        if (current && !address.value) address.value = current;
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const button = form.querySelector("button");
        button.disabled = true;
        error.hidden = true;
        try {
          await invoke("save_server", { address: address.value });
        } catch (failure) {
          error.textContent = String(failure);
          error.hidden = false;
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
