[package]
name = "super-sparrow"
version = "0.1.2"
description = "Super Sparrow desktop app"
edition = "2024"
rust-version = "1.99"

[lib]
name = "super_sparrow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }
url = "=2.5.8"

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-notification = "=2.8.0"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-updater = "=2.14.1"
url = "=2.5.8"
xcap = "=0.9.10"

[target.'cfg(target_os = "linux")'.dependencies]
glib = "=0.18.5"

# Smaller, faster installers. Panics still unwind: a failed screenshot must come back as an error.
[profile.release]
codegen-units = 1
lto = true
strip = true
opt-level = "s"

# Screenshots are encoded as PNG in Rust, so the encoder keeps full speed.
[profile.release.package.png]
opt-level = 3

[profile.release.package.fdeflate]
opt-level = 3

[profile.release.package.crc32fast]
opt-level = 3
