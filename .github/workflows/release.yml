name: Release

# Push a tag such as v0.2.0 to build and publish a release. The tag must match the version in
# desktop/src-tauri/tauri.conf.json.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  server:
    name: Server binaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build Linux binaries
        working-directory: server
        env:
          CGO_ENABLED: "0"
        run: |
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "bin/sparrow-${GITHUB_REF_NAME}-linux-${arch}" ./cmd/sparrow
          done
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - name: Build the frontend the server serves
        run: |
          bun install --frozen-lockfile
          make build-web
          tar -czf "server/bin/sparrow-${GITHUB_REF_NAME}-web.tar.gz" -C web/dist/client .
      - name: Create the release with the server binaries and frontend
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: server/bin/sparrow-*
          generate_release_notes: true

  cli:
    name: CLI (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build the CLI
        working-directory: server
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          suffix=""
          if [ "$GOOS" = "windows" ]; then suffix=".exe"; fi
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "cli-dist/sparrow-${GOOS}-${GOARCH}${suffix}" ./cmd/sparrow
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: server/cli-dist/*
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Sign and publish the CLI
    needs: [server, cli]
    runs-on: ubuntu-24.04
    # The release environment holds CLI_SIGNING_KEY and requires a reviewer's approval for each run.
    environment: release
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/download-artifact@v4.3.0
        with:
          pattern: cli-*
          path: cli-dist
          merge-multiple: true
      - name: Build the signing tool for this runner
        working-directory: server
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "$RUNNER_TEMP/sparrow-sign" ./cmd/sparrow
      - name: Sign the manifest and write the checksums
        env:
          CLI_SIGNING_KEY: ${{ secrets.CLI_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$CLI_SIGNING_KEY" || { echo "CLI_SIGNING_KEY is not set in the release environment" >&2; exit 1; }
          # The key goes in on stdin only, never as an argument. printf is a shell builtin, so it never appears in a process list.
          printf '%s' "$CLI_SIGNING_KEY" | "$RUNNER_TEMP/sparrow-sign" release sign \
            --key-file - --version "$GITHUB_REF_NAME" --dir cli-dist
          cd cli-dist
          test -f manifest.json && test -f manifest.json.sig
          test "$(ls sparrow-* | wc -l)" -eq 6
          sha256sum sparrow-* manifest.json manifest.json.sig > SHA256SUMS
      - name: Upload the CLI to the release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            cli-dist/sparrow-*
            cli-dist/manifest.json
            cli-dist/manifest.json.sig
            cli-dist/SHA256SUMS

  desktop:
    name: Desktop (${{ matrix.platform }})
    needs: server
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - name: Install the Linux libraries Tauri builds against
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Add both macOS targets for the universal build
        if: matrix.platform == 'macos-latest'
        working-directory: desktop/src-tauri
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2.9.3
        with:
          workspaces: desktop/src-tauri
      - run: bun install --frozen-lockfile
      - name: Build and upload the installers
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tauriScript: bunx tauri
          tagName: ${{ github.ref_name }}
          args: ${{ matrix.args }}
