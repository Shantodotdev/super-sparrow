name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  server:
    name: Go server
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: make check-go
      - run: make test-go
      - run: make build-server

  web:
    name: Web and formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: make check-web
      - run: make test-web
      - run: make build-web
      - run: bun run format:check

  desktop:
    name: Desktop app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install the Linux libraries Tauri builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: swatinem/rust-cache@v2.9.3
        with:
          workspaces: desktop/src-tauri
      - run: make check-desktop

  deployment:
    name: Deployment checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 -m unittest discover -s deploy -p '*_test.py'
      - run: bash -n deploy/install-doppler.sh
      - run: docker compose -f deploy/compose.production.yaml config --no-interpolate --no-env-resolution --quiet

  deploy:
    name: Deploy production
    needs: [server, web, desktop, deployment]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://sparrow.premiumcommerce.site
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build and publish the immutable server image
        id: image
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}"
          docker build --platform linux/amd64 -f deploy/Dockerfile \
            --build-arg "VERSION=sha-${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" -t "$image" .
          registry_config="$(mktemp -d)"
          trap 'rm -rf "$registry_config"' EXIT
          export DOCKER_CONFIG="$registry_config"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          docker push "$image"
          digest="$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')"
          printf 'ref=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Install the pinned Doppler CLI
        run: |
          doppler="$(bash deploy/install-doppler.sh)"
          dirname "$doppler" >> "$GITHUB_PATH"
      - name: Deploy with production settings from Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          python3 deploy/deploy.py --project super-sparrow --config prd \
            --mode release --image "$IMAGE" --commit "$GITHUB_SHA"
