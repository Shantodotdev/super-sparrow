{{define "content"}}
<h1 style="margin:0 0 8px;font-size:20px;line-height:28px;font-weight:600;">Join your team on Super Sparrow</h1>
<p style="margin:0 0 24px;font-size:15px;line-height:22px;color:#44403c;">{{.Inviter}} added you to the team. Sign in with {{.Email}} and we'll email you a code.</p>
<table role="presentation" cellpadding="0" cellspacing="0" border="0">
<tr>
<td style="background-color:#1c1917;border-radius:6px;">
<a href="{{.URL}}" style="display:inline-block;padding:10px 18px;font-size:14px;font-weight:600;color:#ffffff;text-decoration:none;">Open Super Sparrow</a>
</td>
</tr>
</table>
{{end}}
